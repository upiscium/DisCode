name: Wire Phase 4E stale predicate

on:
  push:
    branches:
      - feat/permission-reconciliation
    paths:
      - .github/workflows/wire-phase4e-predicate.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/permission-reconciliation
      - run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/bridge/bridge.ts")
          text = p.read_text()
          old = 'import { PermissionPublicationTracker } from "./permission-publication.js";'
          new = 'import {\n  hasPendingPermissionRequest,\n  PermissionPublicationTracker,\n} from "./permission-publication.js";'
          if text.count(old) != 1:
              raise SystemExit("permission publication import not found exactly once")
          text = text.replace(old, new, 1)

          old = '''    const stillPending = current.some(
              (request) => request.id === parsed.permissionId && request.sessionID === parsed.sessionId,
            );'''.replace('      (request)', '      (request)').replace('    );', '    );')
          old = '''    const stillPending = current.some(
      (request) => request.id === parsed.permissionId && request.sessionID === parsed.sessionId,
    );'''
          new = '''    const stillPending = hasPendingPermissionRequest(
      current,
      parsed.sessionId,
      parsed.permissionId,
    );'''
          if text.count(old) != 1:
              raise SystemExit("stale permission predicate not found exactly once")
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bridge/bridge.ts
          git commit -m 'refactor: share permission pending-state predicate'
          git push origin HEAD:feat/permission-reconciliation
