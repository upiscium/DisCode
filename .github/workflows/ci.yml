name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bootstrap phase: package-lock.json is intentionally absent until the first online install.
      # Once the lockfile is committed, replace this with `npm ci`.
      - run: npm install
      - run: npm run check
