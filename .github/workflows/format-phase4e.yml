name: Format Phase 4E

on:
  push:
    branches:
      - feat/permission-reconciliation
    paths:
      - .github/workflows/format-phase4e.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/permission-reconciliation
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome format --write src/bridge/bridge.ts src/bridge/permission-reconciliation.ts tests/permission-compat.test.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bridge/bridge.ts src/bridge/permission-reconciliation.ts tests/permission-compat.test.ts
          git commit -m 'style: format permission reconciliation changes'
          git push origin HEAD:feat/permission-reconciliation
