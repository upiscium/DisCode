name: Phase4F docs

on:
  push:
    branches:
      - feat/loadcredential-secrets
    paths:
      - .github/workflows/phase4f-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/loadcredential-secrets
      - name: Update Phase 4F documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          old = '''The flake exports `nixosModules.default` and `nixosModules.opencode-discord-bridge`. A deployment flake can import the module and run the Bridge as a durable systemd service. For example, to keep secrets in `~/secrets/ocb_secrets.env` owned by an existing user and explicitly enable loopback metrics:'''
          new = '''The flake exports `nixosModules.default` and `nixosModules.opencode-discord-bridge`. A deployment flake can import the module and run the Bridge as a durable systemd service. For example, to let systemd copy a root/operator-owned dotenv secret into the service credential directory while explicitly enabling loopback metrics:'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''            secretsFile = "~/secrets/ocb_secrets.env";'''
          new = '''            secretsCredentialFile = "/run/secrets/opencode-discord-bridge.env";'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''`secretsFile` is only a path string. Nix never reads the selected file and the module rejects paths that already point into the Nix store. `~/...` is expanded at runtime using the configured service user's home; with the default dedicated system user, use a path readable by that user (typically an absolute path). The service user must have filesystem permission to read the file.

`environmentFile` and `environment` remain available for non-secret or legacy configuration. `STATE_FILE` is controlled by the module and placed under `/var/lib/<stateDirectory>/<stateFile>`. The module rejects store-backed `environmentFile` paths as well.

The NixOS module defaults to `logLevel = "info"`, `logFormat = "json"`, and `metrics.enable = false`. If metrics are enabled, their defaults remain `address = "127.0.0.1"` and `port = 9464`; the module does not add the port to `networking.firewall.allowedTCPPorts`.

By default the module creates an `opencode-discord-bridge` system user/group, starts after `network-online.target`, uses systemd `StateDirectory` for persistent writable state, restarts on abnormal exit, and stops the process with `SIGTERM`. Restarting or stopping this service does not start, stop, migrate, or delete any OpenCode server/session.

A future systemd `LoadCredential=` layer may copy/isolate the selected secret source further; the application-level variable contract does not depend on a specific secret backend.'''
          new = '''`secretsCredentialFile` is an absolute source path used only by systemd `LoadCredential=`. Nix never reads the source content and rejects sources already inside the Nix store. systemd exposes the runtime copy as `ocb-secrets.env` inside its private credential directory, while the module sets `OCB_SECRETS_FILE=%d/ocb-secrets.env`. The Bridge therefore keeps the same application-level secret-file contract without requiring the service user to have direct read permission on the source file.

Legacy `secretsFile` remains supported and backward compatible. It passes the selected path directly as `OCB_SECRETS_FILE`, so that file must remain readable by the configured service user; `~/...` is expanded by the Bridge at runtime. `secretsFile` and `secretsCredentialFile` are mutually exclusive and conflicting configuration fails during Nix evaluation.

`environmentFile` and `environment` remain available for non-secret or legacy configuration. `STATE_FILE` is controlled by the module and placed under `/var/lib/<stateDirectory>/<stateFile>`. The module rejects store-backed `environmentFile`, `secretsFile`, and `secretsCredentialFile` paths. The credential source path is visible in systemd unit metadata, so operators should not encode secret values into filenames.

The NixOS module defaults to `logLevel = "info"`, `logFormat = "json"`, and `metrics.enable = false`. If metrics are enabled, their defaults remain `address = "127.0.0.1"` and `port = 9464`; the module does not add the port to `networking.firewall.allowedTCPPorts`.

By default the module creates an `opencode-discord-bridge` system user/group, starts after `network-online.target`, uses systemd `StateDirectory` for persistent writable state, restarts on abnormal exit, and stops the process with `SIGTERM`. Restarting or stopping this service does not start, stop, migrate, or delete any OpenCode server/session. `LoadCredential=` is optional deployment hardening; agenix or sops-nix may provide the source path without becoming Bridge dependencies.'''
          assert old in text
          text = text.replace(old, new, 1)
          readme.write_text(text)

          arch = Path("docs/architecture.md")
          text = arch.read_text()
          old = '''Runtime non-secret configuration can still be supplied through `Environment=` or a systemd `EnvironmentFile`. Secrets can instead be separated into an optional dotenv-style file selected with `OCB_SECRETS_FILE` or the NixOS module's `secretsFile` option. The Bridge expands `~`/`~/...` against the runtime user's home, accepts ordinary absolute or relative filesystem paths, and loads the file before repository-local `.env`.'''
          new = '''Runtime non-secret configuration can still be supplied through `Environment=` or a systemd `EnvironmentFile`. Secrets remain an application-level dotenv file selected with `OCB_SECRETS_FILE`. The NixOS module can supply that contract either directly with legacy `secretsFile` or through systemd `LoadCredential=` with `secretsCredentialFile`. The Bridge parser itself is unchanged: it expands `~`/`~/...` when a normal path is supplied and loads the selected file before repository-local `.env`.'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''The NixOS module only places the secret-file path in the service environment; Nix never reads or serializes the file content. A configured Nix-store-backed `secretsFile` is rejected. The service user must have filesystem permission to read the selected file. Missing, unreadable, or malformed configured secret files fail startup without including secret contents in the error.'''
          new = '''In legacy `secretsFile` mode the NixOS module places only the selected path in the service environment; Nix never reads or serializes the file content, Nix-store-backed paths are rejected, and the service user must be able to read the source directly.

In `secretsCredentialFile` mode the source must be an absolute non-store path. systemd loads it as credential `ocb-secrets.env` and exposes the private runtime copy under `%d/ocb-secrets.env`; the module sets `OCB_SECRETS_FILE` to that credential-directory path. The source may therefore remain unreadable by the Bridge service user outside systemd's credential handoff. `secretsFile` and `secretsCredentialFile` are mutually exclusive so there is exactly one file authority. Missing/unreadable credential sources prevent the unit from starting, while malformed credential content still fails in the unchanged Bridge parser without exposing secret values.'''
          assert old in text
          text = text.replace(old, new, 1)
          arch.write_text(text)
          PY

          rm .github/workflows/phase4f-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/architecture.md .github/workflows/phase4f-docs.yml
          git commit -m "docs: document LoadCredential secret mode"
          git push
