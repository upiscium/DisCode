name: Wire Phase 4E stale predicate v2

on:
  push:
    branches:
      - feat/permission-reconciliation
    paths:
      - .github/workflows/wire-phase4e-predicate-v2.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/permission-reconciliation
      - run: python3 scripts/_tmp_phase4e_wire.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bridge/bridge.ts
          git commit -m 'refactor: share permission pending-state predicate'
          git push origin HEAD:feat/permission-reconciliation
