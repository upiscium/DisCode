name: Update metrics lockfile

on:
  push:
    branches:
      - feat/metrics-endpoint
    paths:
      - package.json
      - .github/workflows/update-metrics-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/metrics-endpoint
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'build: update npm lockfile for Prometheus client'
          git push origin HEAD:feat/metrics-endpoint
