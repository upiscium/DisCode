name: Update Phase 4E docs

on:
  push:
    branches:
      - feat/permission-reconciliation
    paths:
      - .github/workflows/docs-phase4e.yml

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/permission-reconciliation
      - run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "Pending Ask requests are reconciled per host when the bridge restarts.",
              "Pending Ask and permission requests are reconciled per host when the bridge restarts. OpenCode remains the source of truth: the Bridge re-queries each bound directory and re-surfaces only requests that are still pending for the exact host/session/directory binding.",
          )
          replace_once(
              "README.md",
              "10. Structured logs use stable identifiers rather than message payloads. Prompt text, Ask answers, tool output, attachment content, directory paths, and Discord user/guild IDs are not part of the normal log context, while credential-like fields and known secret values are redacted.",
              "10. Structured logs use stable identifiers rather than message payloads. Prompt text, Ask answers, tool output, attachment content, directory paths, and Discord user/guild IDs are not part of the normal log context, while credential-like fields and known secret values are redacted.\n11. Pending permissions are never reconstructed from Discord history or persisted as Bridge authority. Startup reconciliation and permission-button handling both consult the selected OpenCode host, and stale/resolved requests are rejected instead of replayed.",
          )
          replace_once(
              "docs/architecture.md",
              "Permission messages are de-duplicated in memory by `(hostId, permission ID)`. Pending question state is keyed by `(hostId, sessionId)`. OpenCode remains the source of truth for whether either request is still pending.\n\nPending question requests are queried per host during bridge startup so an Ask that survived a bridge restart can be surfaced again.",
              "Pending question state is keyed by `(hostId, sessionId)`. Permission publication state is keyed by `(hostId, permission ID)` and reserves an entry before Discord send, so startup reconciliation and live SSE cannot publish the same request concurrently. A failed Discord send rolls that reservation back. OpenCode remains the source of truth for whether either request is still pending.\n\nPending question and permission requests are queried per host during Bridge startup after the per-host SSE consumers start. Permission reconciliation derives only bound directories from persisted state, calls the selected host's authenticated `GET /permission?directory=...`, and surfaces a request only when host ID, session ID, and directory all match one persisted binding. Permission requests themselves are not persisted.\n\nBefore a Discord permission button sends a reply, the Bridge queries the selected OpenCode host again and confirms the same request is still pending. A request resolved by another OpenCode client is therefore rejected as stale rather than replayed. Reconciliation failures are isolated and logged as `opencode.permission_reconcile_failed` with bounded `host_id` context only.",
          )
          replace_once(
              "docs/architecture.md",
              "  -> permission.updated -> matching host/session binding -> Discord buttons",
              "  -> permission.updated -> matching host/session/directory binding -> race-safe Discord buttons",
          )
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/architecture.md
          git commit -m 'docs: document pending permission reconciliation'
          git push origin HEAD:feat/permission-reconciliation
